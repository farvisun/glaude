name: Feature request
description: An idea that would make Glaude better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: else
    attributes:
      label: Anything else?
      description: Other apps that do this well, sketches, links.
