name: Bug report
description: Something in Glaude doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
  - type: input
    id: version
    attributes:
      label: Glaude version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: cli
    attributes:
      label: CLI versions
      description: Output of `claude --version` and/or `codex --version`.
  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: Remove anything private (tokens, paths you don't want to share) first.
      render: text
