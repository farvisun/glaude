name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["site/**", "docs/**", "**.md", ".github/ISSUE_TEMPLATE/**", ".github/workflows/pages.yml", ".github/workflows/release.yml"]
  pull_request:
    paths-ignore: ["site/**", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - name: Install UI dependencies
        run: bun install --frozen-lockfile
        working-directory: ui
      # The Tauri crate embeds ui/dist at compile time.
      - name: Build UI
        run: bun run build
        working-directory: ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Type-check and test UI
        run: bun run check && bun run test
        working-directory: ui

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install UI dependencies
        run: bun install --frozen-lockfile
        working-directory: ui
      - name: Build UI
        run: bun run build
        working-directory: ui
      # Catches platform-specific code (cfg(windows), cfg(unix)) early.
      - name: Clippy for this platform
        run: cargo clippy --workspace --target ${{ matrix.target }} -- -D warnings
      - name: Build bundles
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: bunx @tauri-apps/cli@2
          args: --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: glaude-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
