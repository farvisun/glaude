name: Release

# Push a tag vX.Y.Z (matching the version in tauri.conf.json) to build the
# installers for macOS (universal), Windows and Linux, attach them with
# SHA-256 checksums, and publish the release once every build has passed.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build again (for example v0.1.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Check the tag matches the app version
        id: meta
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "v$version" != "$tag" ]; then
            echo "::error::Tag $tag does not match tauri.conf.json version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Reuse the release when this tag is built again; otherwise create a
          # draft and take its id from the response (the list endpoint can lag).
          id="$(gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null || true)"
          if [ -z "$id" ]; then
            notes="docs/releases/$TAG.md"
            if [ -f "$notes" ]; then
              id="$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$TAG" -f name="Glaude $VERSION" -F draft=true -F body=@"$notes" --jq .id)"
            else
              id="$(gh api -X POST "repos/$GH_REPO/releases" -f tag_name="$TAG" -f name="Glaude $VERSION" -F draft=true -F generate_release_notes=true --jq .id)"
            fi
          fi
          if [ -z "$id" ]; then
            echo "::error::Could not find or create the release for $TAG"
            exit 1
          fi
          echo "Release id: $id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            args: ""
          - name: Windows x64
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}
      - name: Install UI dependencies
        run: bun install --frozen-lockfile
        working-directory: ui
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tauriScript: bunx @tauri-apps/cli@2
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --pattern '*' --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest
