<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21497f"/>
      <stop offset="1" stop-color="#0c1830"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe0d5"/>
      <stop offset="1" stop-color="#4fb9ae"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c865"/>
      <stop offset="1" stop-color="#e9a83a"/>
    </linearGradient>
  </defs>
  <!-- squircle on Apple's 824px content grid -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="4"/>
  <!-- back bubble: left-to-right, tail on the left -->
  <path d="M292 616 L246 700 L364 628 Z" fill="url(#back)"/>
  <rect x="236" y="300" width="400" height="330" rx="78" fill="url(#back)"/>
  <!-- front bubble: right-to-left, tail on the right -->
  <rect x="396" y="438" width="404" height="300" rx="76" fill="#0c1830" fill-opacity=".35" transform="translate(10 16)"/>
  <path d="M736 724 L790 812 L660 736 Z" fill="#4fb9ae"/>
  <rect x="396" y="438" width="404" height="300" rx="76" fill="url(#front)"/>
  <!-- right-aligned lines: Persian text runs from the right -->
  <g stroke="#0e1d38" stroke-width="34" stroke-linecap="round">
    <line x1="510" y1="530" x2="716" y2="530"/>
    <line x1="580" y1="596" x2="716" y2="596"/>
    <line x1="470" y1="662" x2="716" y2="662"/>
  </g>
</svg>
